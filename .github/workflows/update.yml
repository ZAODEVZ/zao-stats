name: update

on:
  schedule:
    - cron: "40 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Respect holders, WaveWarZ, render
        env:
          # Optional: your own Optimism RPC. Unset, the public one is used (10k-block log calls, retried).
          OPTIMISM_RPC: ${{ secrets.OPTIMISM_RPC }}
        run: node scripts/update.mjs
      - name: Commit
        run: |
          git config user.name "zao-stats"
          git config user.email "zao-stats@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "update: $(date -u +%Y-%m-%d)"
          git push
